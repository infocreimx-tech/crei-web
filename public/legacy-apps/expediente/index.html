<!doctype html>
<html lang="es">
  <head>
    <script src="/legacy-apps/injectSSO.js"></script>
    <link rel="stylesheet" href="/legacy-apps/crei-theme.css">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expediente CREI</title>
    <style>
      :root {
        --bg: #f6f7fb;
        --panel: #ffffff;
        --ink: #172033;
        --muted: #64748b;
        --line: #e2e8f0;
        --brand: #0369a1;
        --brand-dark: #075985;
        --soft: #e0f2fe;
        --danger: #dc2626;
        --ok: #059669;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: var(--ink);
        background:
          radial-gradient(circle at top left, rgba(14, 165, 233, 0.16), transparent 34rem),
          linear-gradient(180deg, #f8fafc 0%, var(--bg) 100%);
      }

      button, input, select, textarea { font: inherit; }
      button { cursor: pointer; }
      .shell { max-width: 1180px; margin: 0 auto; padding: 24px; }
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 22px;
      }
      .eyebrow {
        margin: 0 0 6px;
        color: var(--brand);
        font-size: 11px;
        font-weight: 800;
        letter-spacing: .16em;
        text-transform: uppercase;
      }
      h1 { margin: 0; font-size: clamp(28px, 4vw, 44px); line-height: 1; letter-spacing: 0; }
      .subtitle { margin: 10px 0 0; color: var(--muted); max-width: 680px; line-height: 1.5; }
      .actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
      .btn {
        border: 0;
        min-height: 42px;
        border-radius: 8px;
        padding: 0 16px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-weight: 800;
        transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
      }
      .btn:hover { transform: translateY(-1px); }
      .btn-primary { background: var(--brand); color: white; box-shadow: 0 12px 22px rgba(3, 105, 161, .22); }
      .btn-primary:hover { background: var(--brand-dark); }
      .btn-ghost { background: white; color: var(--brand); border: 1px solid var(--line); }
      .btn-danger { background: #fee2e2; color: #991b1b; }

      .stats {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 14px;
        margin-bottom: 18px;
      }
      .stat {
        background: rgba(255,255,255,.82);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 16px;
      }
      .stat span { display: block; color: var(--muted); font-size: 12px; font-weight: 700; }
      .stat strong { display: block; margin-top: 6px; font-size: 28px; line-height: 1; }

      .toolbar {
        display: grid;
        grid-template-columns: 1fr 180px;
        gap: 12px;
        margin-bottom: 18px;
      }
      .search, .select {
        width: 100%;
        border: 1px solid var(--line);
        background: white;
        min-height: 44px;
        border-radius: 8px;
        padding: 0 14px;
        color: var(--ink);
        outline: none;
      }
      .search:focus, .select:focus, input:focus, textarea:focus {
        border-color: rgba(3, 105, 161, .55);
        box-shadow: 0 0 0 4px rgba(14, 165, 233, .14);
      }

      .grid { display: grid; gap: 14px; }
      .card {
        background: rgba(255,255,255,.9);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 18px;
        box-shadow: 0 14px 32px rgba(15, 23, 42, .06);
      }
      .record {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: 18px;
        align-items: start;
      }
      .folio {
        display: inline-flex;
        align-items: center;
        width: fit-content;
        border-radius: 6px;
        background: var(--soft);
        color: var(--brand-dark);
        padding: 5px 8px;
        font-size: 12px;
        font-weight: 900;
        letter-spacing: .04em;
      }
      .record h2 { margin: 10px 0 4px; font-size: 22px; line-height: 1.15; }
      .meta {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px 18px;
        margin-top: 16px;
      }
      .item { min-width: 0; }
      .item b { display: block; font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
      .item span { display: block; margin-top: 3px; overflow-wrap: anywhere; }
      .status {
        display: inline-flex;
        align-items: center;
        border-radius: 999px;
        padding: 5px 10px;
        font-size: 12px;
        font-weight: 800;
        background: #dcfce7;
        color: #166534;
        text-transform: capitalize;
      }
      .status.inactivo { background: #f1f5f9; color: #475569; }
      .status.alta { background: #fef3c7; color: #92400e; }
      .empty, .loading, .error {
        padding: 42px;
        text-align: center;
        color: var(--muted);
      }
      .error { color: var(--danger); font-weight: 700; }

      dialog {
        border: 0;
        width: min(860px, calc(100vw - 28px));
        border-radius: 8px;
        padding: 0;
        box-shadow: 0 26px 70px rgba(15, 23, 42, .32);
      }
      dialog::backdrop { background: rgba(15, 23, 42, .48); backdrop-filter: blur(4px); }
      .modal-head {
        padding: 22px 24px;
        border-bottom: 1px solid var(--line);
        display: flex;
        justify-content: space-between;
        gap: 16px;
      }
      .modal-head h2 { margin: 0; font-size: 24px; }
      .modal-body { padding: 22px 24px 24px; }
      .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
      .full { grid-column: 1 / -1; }
      label { display: block; font-size: 12px; font-weight: 800; color: #334155; margin-bottom: 6px; }
      input, select, textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 11px 12px;
        color: var(--ink);
        background: #fff;
        outline: none;
      }
      textarea { min-height: 92px; resize: vertical; }
      .hint { margin-top: 6px; color: var(--muted); font-size: 12px; }
      .form-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 22px;
        padding-top: 18px;
        border-top: 1px solid var(--line);
      }
      .toast {
        position: fixed;
        left: 50%;
        bottom: 20px;
        transform: translateX(-50%);
        background: #0f172a;
        color: white;
        border-radius: 8px;
        padding: 12px 16px;
        font-weight: 800;
        box-shadow: 0 16px 36px rgba(15, 23, 42, .26);
        z-index: 10;
        display: none;
      }
      .toast.show { display: block; }

      @media (max-width: 820px) {
        .topbar, .record { grid-template-columns: 1fr; display: grid; }
        .actions { justify-content: stretch; }
        .actions .btn, .record .btn { width: 100%; }
        .stats, .meta, .toolbar, .form-grid { grid-template-columns: 1fr; }
        .full { grid-column: auto; }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">Portal terapeutas</p>
          <h1>Expediente único</h1>
          <p class="subtitle">
            Datos esenciales del paciente. El folio se genera automáticamente en Supabase al guardar un expediente nuevo.
          </p>
        </div>
        <div class="actions">
          <button class="btn btn-ghost" id="refreshBtn" type="button">Actualizar</button>
          <button class="btn btn-primary" id="newBtn" type="button">Nuevo expediente</button>
        </div>
      </header>

      <section class="stats" aria-label="Resumen de expedientes">
        <div class="stat"><span>Total</span><strong id="statTotal">0</strong></div>
        <div class="stat"><span>Activos</span><strong id="statActive">0</strong></div>
        <div class="stat"><span>Último folio</span><strong id="statLast">-</strong></div>
      </section>

      <section class="toolbar" aria-label="Filtros">
        <input class="search" id="searchInput" type="search" placeholder="Buscar por folio, nombre, teléfono, correo o terapeuta" />
        <select class="select" id="statusFilter">
          <option value="">Todos los estados</option>
          <option value="activo">Activo</option>
          <option value="inactivo">Inactivo</option>
          <option value="alta">Alta</option>
        </select>
      </section>

      <main id="records" class="grid">
        <div class="card loading">Cargando expedientes...</div>
      </main>
    </div>

    <dialog id="recordDialog">
      <form id="recordForm">
        <div class="modal-head">
          <div>
            <p class="eyebrow" id="modalEyebrow">Nuevo</p>
            <h2 id="modalTitle">Crear expediente</h2>
            <p class="hint" id="folioHint">El folio se asigna al guardar.</p>
          </div>
          <button class="btn btn-ghost" value="cancel" type="button" id="closeBtn">Cerrar</button>
        </div>
        <div class="modal-body">
          <input type="hidden" name="id" />
          <div class="form-grid">
            <div class="full">
              <label for="nombre_completo">Nombre completo *</label>
              <input id="nombre_completo" name="nombre_completo" required placeholder="Nombre y apellidos" autocomplete="off" />
            </div>
            <div>
              <label for="telefono">Teléfono</label>
              <input id="telefono" name="telefono" type="tel" placeholder="55 1234 5678" />
            </div>
            <div>
              <label for="email">Correo</label>
              <input id="email" name="email" type="email" placeholder="paciente@correo.com" />
            </div>
            <div>
              <label for="fecha_nacimiento">Fecha de nacimiento</label>
              <input id="fecha_nacimiento" name="fecha_nacimiento" type="date" />
            </div>
            <div>
              <label for="fecha_ingreso">Fecha de ingreso</label>
              <input id="fecha_ingreso" name="fecha_ingreso" type="date" />
            </div>
            <div>
              <label for="estado">Estado</label>
              <select id="estado" name="estado">
                <option value="activo">Activo</option>
                <option value="inactivo">Inactivo</option>
                <option value="alta">Alta</option>
              </select>
            </div>
            <div>
              <label for="terapeuta_asignado">Terapeuta asignado</label>
              <input id="terapeuta_asignado" name="terapeuta_asignado" placeholder="Nombre del terapeuta" />
            </div>
            <div class="full">
              <label for="motivo_ingreso">Motivo de ingreso</label>
              <textarea id="motivo_ingreso" name="motivo_ingreso" placeholder="Razón principal por la que inicia atención"></textarea>
            </div>
            <div>
              <label for="contacto_emergencia_nombre">Contacto de emergencia</label>
              <input id="contacto_emergencia_nombre" name="contacto_emergencia_nombre" placeholder="Nombre del contacto" />
            </div>
            <div>
              <label for="contacto_emergencia_telefono">Teléfono de emergencia</label>
              <input id="contacto_emergencia_telefono" name="contacto_emergencia_telefono" type="tel" placeholder="55 9876 5432" />
            </div>
            <div class="full">
              <label for="notas_clinicas">Notas clínicas iniciales</label>
              <textarea id="notas_clinicas" name="notas_clinicas" placeholder="Observaciones necesarias para el seguimiento"></textarea>
            </div>
          </div>
          <div class="form-actions">
            <button class="btn btn-ghost" type="button" id="cancelBtn">Cancelar</button>
            <button class="btn btn-primary" type="submit" id="saveBtn">Guardar expediente</button>
          </div>
        </div>
      </form>
    </dialog>

    <div class="toast" id="toast"></div>

    <script>
      const SUPABASE_URL = "https://uywihjppwzrrfjkguvot.supabase.co";
      const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV5d2loanBwd3pycmZqa2d1dm90Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM5NTQ1OTEsImV4cCI6MjA4OTUzMDU5MX0.7eFia3SwiV4bBHvo-qZsmzEEu4RqTRMnMwbVZgrLZFw";
      const API = `${SUPABASE_URL}/rest/v1/expediente`;
      const headers = {
        apikey: SUPABASE_ANON_KEY,
        Authorization: `Bearer ${SUPABASE_ANON_KEY}`,
        "Content-Type": "application/json",
      };

      const state = { records: [], editing: null };
      const $ = (id) => document.getElementById(id);

      function today() {
        return new Date().toISOString().slice(0, 10);
      }

      function clean(value) {
        const text = String(value || "").trim();
        return text || null;
      }

      function formatDate(value) {
        if (!value) return "No registrado";
        return new Date(value).toLocaleDateString("es-MX", { timeZone: "UTC" });
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function showToast(message) {
        const toast = $("toast");
        toast.textContent = message;
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), 2800);
      }

      async function request(path = "", options = {}) {
        const res = await fetch(`${API}${path}`, {
          ...options,
          headers: { ...headers, Prefer: "return=representation", ...(options.headers || {}) },
        });
        if (!res.ok) {
          const text = await res.text();
          throw new Error(text || `Error ${res.status}`);
        }
        if (res.status === 204) return null;
        return res.json();
      }

      async function loadRecords() {
        $("records").innerHTML = '<div class="card loading">Cargando expedientes...</div>';
        try {
          const rows = await request("?select=*&order=created_at.desc");
          state.records = Array.isArray(rows) ? rows : [];
          render();
        } catch (error) {
          $("records").innerHTML = `<div class="card error">No se pudieron cargar los expedientes. ${escapeHtml(error.message)}</div>`;
        }
      }

      function renderStats(records) {
        $("statTotal").textContent = records.length;
        $("statActive").textContent = records.filter((row) => (row.estado || "activo") === "activo").length;
        $("statLast").textContent = records[0]?.folio || "-";
      }

      function matches(row, query, status) {
        const haystack = [
          row.folio,
          row.nombre_completo,
          row.telefono,
          row.email,
          row.terapeuta_asignado,
          row.contacto_emergencia_nombre,
        ].join(" ").toLowerCase();
        const statusOk = !status || (row.estado || "activo") === status;
        return statusOk && (!query || haystack.includes(query));
      }

      function render() {
        const query = $("searchInput").value.trim().toLowerCase();
        const status = $("statusFilter").value;
        const rows = state.records.filter((row) => matches(row, query, status));
        renderStats(state.records);

        if (rows.length === 0) {
          $("records").innerHTML = '<div class="card empty">No hay expedientes con esos filtros.</div>';
          return;
        }

        $("records").innerHTML = rows.map((row) => `
          <article class="card record">
            <div>
              <span class="folio">${escapeHtml(row.folio || "Folio pendiente")}</span>
              <h2>${escapeHtml(row.nombre_completo || "Sin nombre")}</h2>
              <span class="status ${escapeHtml(row.estado || "activo")}">${escapeHtml(row.estado || "activo")}</span>
              <div class="meta">
                <div class="item"><b>Teléfono</b><span>${escapeHtml(row.telefono || "No registrado")}</span></div>
                <div class="item"><b>Correo</b><span>${escapeHtml(row.email || "No registrado")}</span></div>
                <div class="item"><b>Ingreso</b><span>${escapeHtml(formatDate(row.fecha_ingreso || row.created_at))}</span></div>
                <div class="item"><b>Nacimiento</b><span>${escapeHtml(formatDate(row.fecha_nacimiento))}</span></div>
                <div class="item"><b>Terapeuta</b><span>${escapeHtml(row.terapeuta_asignado || "No asignado")}</span></div>
                <div class="item"><b>Emergencia</b><span>${escapeHtml(row.contacto_emergencia_nombre || "No registrado")}</span></div>
                <div class="item full"><b>Motivo de ingreso</b><span>${escapeHtml(row.motivo_ingreso || "No registrado")}</span></div>
                <div class="item full"><b>Notas clínicas</b><span>${escapeHtml(row.notas_clinicas || "Sin notas iniciales")}</span></div>
              </div>
            </div>
            <button class="btn btn-ghost" type="button" data-edit="${escapeHtml(row.id)}">Editar</button>
          </article>
        `).join("");

        document.querySelectorAll("[data-edit]").forEach((button) => {
          button.addEventListener("click", () => openDialog(state.records.find((row) => row.id === button.dataset.edit)));
        });
      }

      function fillForm(row) {
        const form = $("recordForm");
        form.reset();
        form.elements.id.value = row?.id || "";
        form.elements.nombre_completo.value = row?.nombre_completo || "";
        form.elements.telefono.value = row?.telefono || "";
        form.elements.email.value = row?.email || "";
        form.elements.fecha_nacimiento.value = row?.fecha_nacimiento || "";
        form.elements.fecha_ingreso.value = row?.fecha_ingreso || today();
        form.elements.estado.value = row?.estado || "activo";
        form.elements.terapeuta_asignado.value = row?.terapeuta_asignado || "";
        form.elements.motivo_ingreso.value = row?.motivo_ingreso || "";
        form.elements.contacto_emergencia_nombre.value = row?.contacto_emergencia_nombre || "";
        form.elements.contacto_emergencia_telefono.value = row?.contacto_emergencia_telefono || "";
        form.elements.notas_clinicas.value = row?.notas_clinicas || "";
      }

      function openDialog(row = null) {
        state.editing = row;
        $("modalEyebrow").textContent = row ? row.folio : "Nuevo expediente";
        $("modalTitle").textContent = row ? "Editar expediente" : "Crear expediente";
        $("folioHint").textContent = row ? "El folio no se modifica." : "El folio se asigna automáticamente al guardar.";
        fillForm(row);
        $("recordDialog").showModal();
      }

      function closeDialog() {
        $("recordDialog").close();
        state.editing = null;
      }

      function payloadFromForm(form) {
        const fd = new FormData(form);
        return {
          nombre_completo: clean(fd.get("nombre_completo")),
          telefono: clean(fd.get("telefono")),
          email: clean(fd.get("email")),
          fecha_nacimiento: clean(fd.get("fecha_nacimiento")),
          fecha_ingreso: clean(fd.get("fecha_ingreso")) || today(),
          estado: clean(fd.get("estado")) || "activo",
          terapeuta_asignado: clean(fd.get("terapeuta_asignado")),
          motivo_ingreso: clean(fd.get("motivo_ingreso")),
          contacto_emergencia_nombre: clean(fd.get("contacto_emergencia_nombre")),
          contacto_emergencia_telefono: clean(fd.get("contacto_emergencia_telefono")),
          notas_clinicas: clean(fd.get("notas_clinicas")),
        };
      }

      $("recordForm").addEventListener("submit", async (event) => {
        event.preventDefault();
        const form = event.currentTarget;
        const id = form.elements.id.value;
        const payload = payloadFromForm(form);
        if (!payload.nombre_completo) return;

        $("saveBtn").disabled = true;
        $("saveBtn").textContent = "Guardando...";
        try {
          if (id) {
            await request(`?id=eq.${encodeURIComponent(id)}`, {
              method: "PATCH",
              body: JSON.stringify(payload),
            });
            showToast("Expediente actualizado");
          } else {
            await request("", {
              method: "POST",
              body: JSON.stringify(payload),
            });
            showToast("Expediente creado con folio automático");
          }
          closeDialog();
          await loadRecords();
        } catch (error) {
          showToast("No se pudo guardar. Revisa permisos o columnas.");
          console.error(error);
        } finally {
          $("saveBtn").disabled = false;
          $("saveBtn").textContent = "Guardar expediente";
        }
      });

      $("newBtn").addEventListener("click", () => openDialog());
      $("refreshBtn").addEventListener("click", loadRecords);
      $("closeBtn").addEventListener("click", closeDialog);
      $("cancelBtn").addEventListener("click", closeDialog);
      $("searchInput").addEventListener("input", render);
      $("statusFilter").addEventListener("change", render);

      loadRecords();
    </script>
  </body>
</html>
